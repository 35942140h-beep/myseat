<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 자리 배치 프로그램</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; margin: 0; background: #f4f6f9; color: #333; }
        .page { display: none; padding: 15px; max-width: 1400px; margin: 0 auto; }
        .page.active { display: block; }
        
        h2, h3 { color: #2c3e50; text-align: center; margin-top: 10px; }
        button { background: #3498db; color: #fff; border: none; padding: 10px 16px; font-size: 14px; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 3px; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        button.secondary { background: #e67e22; }
        button.success { background: #27ae60; }
        button.danger { background: #e74c3c; }
        button.purple { background: #8e44ad; }
        button.dark { background: #34495e; }

        .step1-container { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .config-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
        .box { flex: 1 1 300px; background: #eef2f7; padding: 15px; border-radius: 8px; min-width: 280px; }
        
        #sectionConfigs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; min-height: 50px; }
        .section-config-card { background: #fff; padding: 10px; border: 1px solid #ccc; border-radius: 6px; text-align: center; width: 100px; }
        .section-config-card input { width: 45px; padding: 4px; text-align: center; border: 1px solid #bbb; border-radius: 3px; }
        
        #groupConfigs { margin-top: 10px; max-height: 400px; overflow-y: auto; min-height: 80px; }
        .group-input-box { background: #fff; padding: 12px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #ddd; }
        .group-input-box input[type="text"] { width: 100%; max-width: 200px; padding: 6px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .group-input-box textarea { width: 100%; height: 90px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; font-size: 13px; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: #fff; padding: 25px; border-radius: 10px; width: 90%; max-width: 650px; max-height: 85vh; overflow-y: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .detail-item { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px 12px; margin-bottom: 6px; border-radius: 5px; border: 1px solid #e9ecef; font-size: 13px; flex-wrap: wrap; gap: 6px; }

        .step2-layout { display: flex; gap: 20px; margin-top: 15px; flex-wrap: wrap; align-items: flex-start; }
        .sidebar { width: 280px; background: #fff; border-radius: 8px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-height: 80vh; overflow-y: auto; flex-shrink: 0; }
        .search-box { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 15px; }
        
        .group-category { margin-bottom: 15px; }
        .group-header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ecf0f1; padding-bottom: 3px; margin-bottom: 5px; }
        .group-category h4 { margin: 0; font-size: 14px; color: #7f8c8d; }
        
        .name-tag { color: #fff; padding: 8px 10px; margin: 4px 0; text-align: center; border-radius: 4px; font-weight: bold; font-size: 13px; cursor: pointer; user-select: none; display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; }
        .name-tag.gender-m { background: #2980b9; } 
        .name-tag.gender-f { background: #c0392b; } 
        .name-tag.gender-none { background: #34495e; } 
        .name-tag.selected { transform: scale(1.02); box-shadow: 0 0 8px rgba(0,0,0,0.4); border: 2px solid #f1c40f; }
        .name-tag.assigned { background: #95a5a6 !important; opacity: 0.5; text-decoration: line-through; cursor: default; }

        .comp-badge { font-size: 10px; background: rgba(0,0,0,0.25); padding: 1px 5px; border-radius: 3px; font-weight: normal; }

        .team-tag { background: #fff; color: #333; padding: 8px 10px; margin: 4px 0; text-align: center; border-radius: 4px; font-weight: bold; font-size: 13px; cursor: pointer; user-select: none; border: 2px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        .team-tag.selected { transform: scale(1.02); box-shadow: 0 0 8px rgba(0,0,0,0.2); }

        .seat-main { flex: 1; background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); min-height: 70vh; overflow-x: auto; min-width: 300px; }
        
        .seat-map-capture { display: flex; gap: 25px; align-items: center; background: #fff; padding: 20px; border-radius: 8px; justify-content: flex-start; }
        .podium-fixed { width: 75px; height: 110px; background: #2c3e50; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; flex-shrink: 0; gap: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.15); position: sticky; left: 0; }
        
        .seat-container { display: flex; flex-direction: column; gap: 20px; align-items: flex-start; flex: 1; }
        .group-seat-box { border: 2px solid #cbd5e1; padding: 15px; border-radius: 8px; background: #fafafa; flex-shrink: 0; }
        .group-seat-box h4 { text-align: center; margin: 0 0 10px; color: #2c3e50; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }
        .seat-grid { display: grid; gap: 8px; }
        .seat { background: #ecf0f1; border: 1px dashed #95a5a6; min-height: 48px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; cursor: pointer; user-select: none; padding: 4px; text-align: center; word-break: break-all; color: #333; }
        .seat.filled-m { background: #d4e6f1; border: 1px solid #2980b9; color: #1b4f72; }
        .seat.filled-f { background: #f9d5e5; border: 1px solid #c0392b; color: #78281f; }
        .seat.filled-none { background: #eaeded; border: 1px solid #7f8c8d; color: #2c3e50; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }

        @media (max-width: 768px) {
            .page { padding: 8px; }
            .step2-layout { flex-direction: column; }
            .sidebar { width: 100%; max-height: 250px; }
            .seat-main { padding: 10px; min-height: 50vh; }
            .seat { min-height: 42px; font-size: 11px; }
        }
    </style>
</head>
<body>

<!-- 1페이지 -->
<div id="page1" class="page active">
    <div class="step1-container">
        <h2>🪑 1단계: 좌석 구조 및 집단별 명단 설정</h2>
        <div class="config-row">
            <div class="box">
                <label style="font-weight:bold;">분단 수 설정:</label>
                <input type="number" id="numSections" min="1" max="8" value="3" onchange="renderSectionConfigs()" style="width: 60px; padding: 5px;">
                <div style="margin-top: 10px; font-weight: bold; font-size: 14px; color: #555;">각 분단별 행·열 설정:</div>
                <div id="sectionConfigs"></div>
            </div>
            <div class="box">
                <label style="font-weight:bold;">참가자 집단(그룹) 수 설정:</label>
                <input type="number" id="numGroups" min="1" max="5" value="2" onchange="renderGroupConfigs()" style="width: 60px; padding: 5px;">
                <div style="margin-top: 10px; font-weight: bold; font-size: 14px; color: #555;">집단 명칭 및 명단 입력:</div>
                <div id="groupConfigs"></div>
            </div>
        </div>
        <div style="text-align: center; margin-bottom: 15px;">
            <button class="dark" onclick="openDetailModal()">⚙️ 참가자 상세 설정 (성별·차량·동행)</button>
        </div>
        <div style="text-align: center; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
            <button class="secondary" onclick="saveData(); alert('저장되었습니다.');">💾 설정 저장하기</button>
            <button class="purple" onclick="exportBackupJSON()">📥 백업 다운로드</button>
            <button class="purple" onclick="document.getElementById('importFile').click()">📂 백업 불러오기</button>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importBackupJSON(event)">
            <button class="danger" onclick="resetData()">🔄 초기화</button>
            <button class="success" onclick="goToStep(2)" style="font-size: 16px; padding: 12px 25px;">🚀 자리 배치 시작</button>
        </div>
    </div>
</div>

<!-- 통합 상세 정보 모달 -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <h3>⚙️ 참가자 상세 설정</h3>
        <p style="font-size: 12px; color: #666; text-align: center; margin-bottom: 12px;">참가자별 성별, 차량 유무 및 함께 앉을 동행 그룹명을 지정하세요. (동행 그룹명이 같은 사람끼리 연속 배치됩니다.)</p>
        <div id="detailListContainer" style="max-height: 50vh; overflow-y: auto; margin-bottom: 15px;"></div>
        <div style="text-align: center;">
            <button class="success" onclick="document.getElementById('detailModal').style.display='none'; saveData();">확인 및 저장</button>
        </div>
    </div>
</div>

<!-- 2페이지 -->
<div id="page2" class="page">
    <div class="top-bar">
        <button class="secondary" onclick="goToStep(1)">⬅️ 설정 수정</button>
        <h2>🪑 2단계: 클릭 토글 방식 자리 배치</h2>
        <div>
            <button class="secondary" onclick="undoSeat()">↩️ 취소</button>
            <button class="purple" onclick="exportImage('seat-map-capture', '자리배치도.png')">📸 이미지 저장</button>
            <button class="danger" onclick="if(confirm('비우시겠습니까?')) { seatHistory.push({...seatAssignments}); seatAssignments={}; teamAssignments={}; saveAll(); renderAll(); }">🔄 전체 비우기</button>
            <button class="success" onclick="goToStep(3)" style="background: #8e44ad;">🏆 팀 배정하기 ➡️</button>
        </div>
    </div>
    <div class="step2-layout">
        <div class="sidebar">
            <h3>참가자 대기실</h3>
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 이름 검색..." oninput="renderSidebar()">
            <div id="sidebar-groups"></div>
        </div>
        <div class="seat-main">
            <div id="seat-map-capture" class="seat-map-capture">
                <div class="podium-fixed"><span style="font-size:24px;">🏛️</span><span style="font-size:10px; font-weight:bold;">연단</span></div>
                <div id="seat-container" class="seat-container"></div>
            </div>
        </div>
    </div>
</div>

<!-- 3페이지 -->
<div id="page3" class="page">
    <div class="top-bar">
        <button class="secondary" onclick="goToStep(2)">⬅️ 자리 배치로</button>
        <h2>🏆 3단계: 팀 별 색상 테두리 배정</h2>
        <div>
            <button class="purple" onclick="exportImage('team-map-capture', '팀배치도.png')">📸 팀 이미지</button>
            <button class="danger" onclick="if(confirm('팀 초기화?')) { teamAssignments={}; saveAll(); renderTeamSeatMap(); }">🔄 초기화</button>
        </div>
    </div>
    <div class="step2-layout">
        <div class="sidebar">
            <h3>팀 설정 및 선택</h3>
            <div style="margin-bottom: 12px; background: #eef2f7; padding: 10px; border-radius: 6px;">
                <label style="font-size: 12px; font-weight: bold;">총 팀 수:</label>
                <input type="number" id="numTeams" min="1" max="10" value="4" onchange="renderTeamConfigs()" style="width: 55px; padding: 4px; text-align: center;">
                <div id="teamConfigsList" style="margin-top: 8px;"></div>
            </div>
            <div id="team-select-sidebar"></div>
        </div>
        <div class="seat-main">
            <div id="team-map-capture" class="seat-map-capture">
                <div class="podium-fixed"><span style="font-size:24px;">🏛️</span><span style="font-size:10px; font-weight:bold;">연단</span></div>
                <div id="team-seat-container" class="seat-container"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const COLORS = ['#e74c3c', '#3498db', '#27ae60', '#f39c12', '#9b59b6', '#1abc9c', '#d35400', '#2980b9'];
    let seatAssignments = {}, teamAssignments = {}, participantDetails = {}, seatHistory = [];
    let selectedStudent = null, selectedTeam = null;

    window.onload = () => { loadData(); loadInputs(); renderTeamConfigs(); };

    function getVal(id) { return document.getElementById(id)?.value; }
    
    function saveAll() {
        localStorage.setItem('ss_num_sec', getVal('numSections') || 3);
        localStorage.setItem('ss_num_grp', getVal('numGroups') || 2);
        localStorage.setItem('ss_sec', JSON.stringify(getSections()));
        localStorage.setItem('ss_grp', JSON.stringify(getGroups()));
        localStorage.setItem('ss_seat', JSON.stringify(seatAssignments));
        localStorage.setItem('ss_team', JSON.stringify(teamAssignments));
        localStorage.setItem('ss_det', JSON.stringify(participantDetails));
    }

    function loadData() {
        seatAssignments = JSON.parse(localStorage.getItem('ss_seat') || '{}');
        teamAssignments = JSON.parse(localStorage.getItem('ss_team') || '{}');
        participantDetails = JSON.parse(localStorage.getItem('ss_det') || '{}');
    }

    function getSections() {
        let num = parseInt(getVal('numSections')) || 3;
        return Array.from({length: num}, (_, i) => ({
            r: getVal(`sec_${i+1}_rows`) || 3,
            c: getVal(`sec_${i+1}_cols`) || 4
        }));
    }

    function getGroups() {
        let num = parseInt(getVal('numGroups')) || 2;
        return Array.from({length: num}, (_, i) => ({
            name: getVal(`group_name_${i}`) || `집단 ${i+1}`,
            text: getVal(`group_text_${i}`) || ''
        }));
    }

    function renderSectionConfigs() {
        let num = parseInt(getVal('numSections')) || 1;
        let old = JSON.parse(localStorage.getItem('ss_sec') || '[{"r":3,"c":4}]');
        document.getElementById('sectionConfigs').innerHTML = Array.from({length: num}, (_, i) => 
            `<div class="section-config-card"><b>${i+1}분단</b><br>행: <input type="number" id="sec_${i+1}_rows" value="${old[i]?.r || 3}"><br>열: <input type="number" id="sec_${i+1}_cols" value="${old[i]?.c || 4}"></div>`
        ).join('');
    }

    function renderGroupConfigs() {
        let num = parseInt(getVal('numGroups')) || 1;
        let old = JSON.parse(localStorage.getItem('ss_grp') || '[{"name":"A그룹","text":""}]');
        document.getElementById('groupConfigs').innerHTML = Array.from({length: num}, (_, i) => 
            `<div class="group-input-box"><b>집단 ${i+1}</b><br>명칭: <input type="text" id="group_name_${i}" value="${old[i]?.name || ''}"><textarea id="group_text_${i}" placeholder="이름 줄바꿈 입력">${old[i]?.text || ''}</textarea></div>`
        ).join('');
    }

    function loadInputs() {
        let savedNumSec = localStorage.getItem('ss_num_sec') || '3';
        let savedNumGrp = localStorage.getItem('ss_num_grp') || '2';
        
        if(document.getElementById('numSections')) document.getElementById('numSections').value = savedNumSec;
        if(document.getElementById('numGroups')) document.getElementById('numGroups').value = savedNumGrp;

        renderSectionConfigs();
        renderGroupConfigs();

        let s = JSON.parse(localStorage.getItem('ss_sec') || '[]');
        s.forEach((v, i) => { 
            let rEl = document.getElementById(`sec_${i+1}_rows`);
            let cEl = document.getElementById(`sec_${i+1}_cols`);
            if(rEl) rEl.value = v.r; 
            if(cEl) cEl.value = v.c; 
        });

        let g = JSON.parse(localStorage.getItem('ss_grp') || '[]');
        g.forEach((v, i) => { 
            let nEl = document.getElementById(`group_name_${i}`);
            let tEl = document.getElementById(`group_text_${i}`);
            if(nEl) nEl.value = v.name; 
            if(tEl) tEl.value = v.text; 
        });
    }

    function saveData() {
        getGroups().forEach(g => {
            g.text.split(/[\n,]+/).forEach(n => {
                let name = n.trim();
                if(name && !participantDetails[name]) participantDetails[name] = { gender: 'none', car: false, comp: '' };
            });
        });
        saveAll();
    }

    function openDetailModal() {
        saveData();
        let container = document.getElementById('detailListContainer');
        container.innerHTML = '';
        let names = [];
        getGroups().forEach(g => names.push(...g.text.split(/[\n,]+/).map(n => n.trim()).filter(Boolean)));
        
        if(!names.length) { container.innerHTML = '입력된 이름이 없습니다.'; document.getElementById('detailModal').style.display = 'flex'; return; }
        
        names.forEach(name => {
            if(!participantDetails[name]) participantDetails[name] = { gender: 'none', car: false, comp: '' };
            let info = participantDetails[name];
            container.innerHTML += `
                <div class="detail-item">
                    <b style="width: 80px;">${name}</b>
                    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                        <span>성별: 
                            <select id="dg_${name}" onchange="participantDetails['${name}'].gender=this.value">
                                <option value="none" ${info.gender==='none'?'selected':''}>미설정</option>
                                <option value="m" ${info.gender==='m'?'selected':''}>남</option>
                                <option value="f" ${info.gender==='f'?'selected':''}>여</option>
                            </select>
                        </span>
                        <label><input type="checkbox" id="dc_${name}" ${info.car?'checked':''} onchange="participantDetails['${name}'].car=this.checked"> 차량</label>
                        <span>동행그룹: <input type="text" id="dcomp_${name}" value="${info.comp || ''}" placeholder="예: 가족" style="width: 90px; padding: 3px;" oninput="participantDetails['${name}'].comp=this.value"></span>
                    </div>
                </div>`;
        });
        document.getElementById('detailModal').style.display = 'flex';
    }

    function getCompanionGroupFor(name) {
        let comp = participantDetails[name]?.comp;
        if(!comp || !comp.trim()) return null;
        let members = [];
        getGroups().forEach(g => {
            g.text.split(/[\n,]+/).forEach(n => {
                let trimmed = n.trim();
                if(trimmed && participantDetails[trimmed]?.comp?.trim() === comp.trim()) {
                    members.push(trimmed);
                }
            });
        });
        return members.length > 1 ? members : null;
    }

    function goToStep(step) {
        saveData();
        [1,2,3].forEach(i => document.getElementById(`page${i}`).classList.remove('active'));
        document.getElementById(`page${step}`).classList.add('active');
        
        if(step === 1) { loadInputs(); }
        if(step === 2) { selectedStudent = null; seatHistory = []; renderAll(); }
        if(step === 3) { selectedTeam = null; renderTeamConfigs(); renderTeamSeatMap(); }
    }

    function renderAll() { renderSidebar(); renderSeatMap(); }
    function getDisplayName(name) { return name + ((participantDetails[name]?.car) ? ' 🚗' : ''); }

    function randomAssignGroup(gIdx) {
        let groups = getGroups();
        let g = groups[gIdx];
        if(!g) return;
        let names = g.text.split(/[\n,]+/).map(n => n.trim()).filter(Boolean);
        let unassignedNames = names.filter(name => !Object.values(seatAssignments).some(s => s.name === name));
        
        if(unassignedNames.length === 0) {
            alert(`${g.name} 집단에서 대기 중인 인원이 없습니다.`);
            return;
        }

        let emptySeats = [];
        let sections = getSections();
        sections.forEach((sec, i) => {
            for(let r=0; r<sec.r; r++) {
                for(let c=0; c<sec.c; c++) {
                    let id = `sec_${i+1}_r_${r}_c_${c}`;
                    if(!seatAssignments[id]) emptySeats.push(id);
                }
            }
        });

        if(emptySeats.length === 0) {
            alert('배치할 수 있는 빈 좌석이 없습니다!');
            return;
        }

        unassignedNames.sort(() => Math.random() - 0.5);
        emptySeats.sort(() => Math.random() - 0.5);

        seatHistory.push({...seatAssignments});

        let count = Math.min(unassignedNames.length, emptySeats.length);
        for(let i=0; i<count; i++) {
            seatAssignments[emptySeats[i]] = { name: unassignedNames[i] };
        }

        saveAll();
        renderAll();
    }

    function renderSidebar() {
        let container = document.getElementById('sidebar-groups');
        container.innerHTML = '';
        let query = getVal('searchInput')?.toLowerCase() || '';

        getGroups().forEach((g, gIdx) => {
            let names = g.text.split(/[\n,]+/).map(n => n.trim()).filter(Boolean).sort();
            let div = document.createElement('div');
            div.className = 'group-category';
            div.innerHTML = `
                <div class="group-header-row">
                    <h4>${g.name} (${names.length})</h4>
                    <button class="secondary" style="font-size:11px; padding:3px 8px; margin:0;" onclick="randomAssignGroup(${gIdx})">🎲 임의배치</button>
                </div>`;
            
            names.forEach(name => {
                if(query && !name.toLowerCase().includes(query)) return;
                let info = participantDetails[name] || { gender: 'none', comp: '' };
                let compText = info.comp ? `<span class="comp-badge">👥 ${info.comp}</span>` : '';
                
                let tag = document.createElement('div');
                tag.className = `name-tag gender-${info.gender}`;
                tag.innerHTML = `<span>${getDisplayName(name)}</span>${compText}`;
                
                if(Object.values(seatAssignments).some(s => s.name === name)) tag.classList.add('assigned');
                else {
                    if(selectedStudent === name) tag.classList.add('selected');
                    tag.onclick = () => { selectedStudent = (selectedStudent === name) ? null : name; renderSidebar(); };
                }
                div.appendChild(tag);
            });
            container.appendChild(div);
        });
    }

    function renderSeatMap() {
        let container = document.getElementById('seat-container');
        container.innerHTML = '';
        getSections().forEach((sec, i) => {
            let box = document.createElement('div');
            box.className = 'group-seat-box';
            box.innerHTML = `<h4>${i+1}분단 (${sec.r}x${sec.c})</h4>`;
            let grid = document.createElement('div');
            grid.className = 'seat-grid';
            grid.style.gridTemplateColumns = `repeat(${sec.c}, minmax(55px, 75px))`;

            for(let r=0; r<sec.r; r++) {
                for(let c=0; c<sec.c; c++) {
                    let id = `sec_${i+1}_r_${r}_c_${c}`;
                    let seat = document.createElement('div');
                    seat.className = 'seat';
                    let assigned = seatAssignments[id];
                    if(assigned) {
                        seat.innerText = getDisplayName(assigned.name);
                        let gender = participantDetails[assigned.name]?.gender || 'none';
                        seat.classList.add(`filled-${gender}`);
                    }
                    
                    seat.onclick = () => {
                        if(!assigned && !selectedStudent) return alert('대기실에서 이름을 먼저 선택하세요!');
                        seatHistory.push({...seatAssignments});
                        
                        if(assigned) {
                            delete seatAssignments[id];
                            delete teamAssignments[id];
                        } else if(selectedStudent) {
                            let compMembers = getCompanionGroupFor(selectedStudent);
                            if(compMembers && compMembers.length > 1) {
                                let unassignedComps = compMembers.filter(m => !Object.values(seatAssignments).some(s => s.name === m));
                                let sectionSeats = [];
                                for(let rr=0; rr<sec.r; rr++) {
                                    for(let cc=0; cc<sec.c; cc++) {
                                        sectionSeats.push(`sec_${i+1}_r_${rr}_c_${cc}`);
                                    }
                                }
                                let startIndex = sectionSeats.indexOf(id);
                                let availableTargetSeats = [];
                                for(let idx = startIndex; idx < sectionSeats.length; idx++) {
                                    let sId = sectionSeats[idx];
                                    if(!seatAssignments[sId]) availableTargetSeats.push(sId);
                                }

                                if(availableTargetSeats.length < unassignedComps.length) {
                                    alert(`선택한 자리부터 분단 내에 빈 자리가 부족하여 동행(${unassignedComps.length}명)을 모두 연속으로 배치할 수 없습니다.`);
                                    seatHistory.pop();
                                    return;
                                }

                                unassignedComps.forEach((memberName, index) => {
                                    seatAssignments[availableTargetSeats[index]] = { name: memberName };
                                });
                            } else {
                                seatAssignments[id] = { name: selectedStudent };
                            }
                            selectedStudent = null;
                        }
                        saveAll(); renderAll();
                    };
                    grid.appendChild(seat);
                }
            }
            box.appendChild(grid); container.appendChild(box);
        });
    }

    function undoSeat() {
        if(!seatHistory.length) return alert('취소할 내역이 없습니다.');
        seatAssignments = seatHistory.pop();
        selectedStudent = null;
        saveAll(); renderAll();
    }

    function getTeamConfigs() {
        let num = parseInt(getVal('numTeams')) || 1;
        return Array.from({length: num}, (_, i) => ({
            name: getVal(`team_name_${i}`) || `${i+1}팀`,
            color: getVal(`team_color_${i}`) || COLORS[i % COLORS.length]
        }));
    }

    function renderTeamConfigs() {
        let num = parseInt(getVal('numTeams')) || 1;
        document.getElementById('teamConfigsList').innerHTML = Array.from({length: num}, (_, i) => 
            `<div style="display:flex;gap:5px;margin-bottom:5px;align-items:center;">
                <input type="text" id="team_name_${i}" value="${i+1}팀" style="width:90px;padding:4px;font-size:12px;" oninput="renderTeamSidebar()">
                <input type="color" id="team_color_${i}" value="${COLORS[i%COLORS.length]}" style="width:35px;height:26px;border:none;cursor:pointer;" onchange="renderTeamSidebar(); renderTeamSeatMap();">
            </div>`
        ).join('');
        renderTeamSidebar();
    }

    function renderTeamSidebar() {
        let container = document.getElementById('team-select-sidebar');
        container.innerHTML = '';
        getTeamConfigs().forEach((t, i) => {
            let tag = document.createElement('div');
            tag.className = `team-tag ${selectedTeam===i?'selected':''}`;
            tag.style.borderColor = t.color;
            tag.innerHTML = `<span>${t.name}</span><span style="width:14px;height:14px;background:${t.color};border-radius:50%;"></span>`;
            tag.onclick = () => { selectedTeam = (selectedTeam === i) ? null : i; renderTeamSidebar(); };
            container.appendChild(tag);
        });
    }

    function renderTeamSeatMap() {
        let container = document.getElementById('team-seat-container');
        container.innerHTML = '';
        let teams = getTeamConfigs();

        getSections().forEach((sec, i) => {
            let box = document.createElement('div');
            box.className = 'group-seat-box';
            box.innerHTML = `<h4>${i+1}분단 (${sec.r}x${sec.c})</h4>`;
            let grid = document.createElement('div');
            grid.className = 'seat-grid';
            grid.style.gridTemplateColumns = `repeat(${sec.c}, minmax(55px, 75px))`;

            for(let r=0; r<sec.r; r++) {
                for(let c=0; c<sec.c; c++) {
                    let id = `sec_${i+1}_r_${r}_c_${c}`;
                    let seat = document.createElement('div');
                    seat.className = 'seat';
                    let assigned = seatAssignments[id];
                    let tIdx = teamAssignments[id];

                    if(assigned) {
                        seat.innerText = getDisplayName(assigned.name);
                        seat.classList.add(`filled-${participantDetails[assigned.name]?.gender || 'none'}`);
                        if(tIdx !== undefined && teams[tIdx]) {
                            seat.style.border = `3px solid ${teams[tIdx].color}`;
                            seat.style.boxShadow = `0 0 5px ${teams[tIdx].color}`;
                        }
                    }
                    seat.onclick = () => {
                        if(!assigned || selectedTeam === null) return alert('팀을 선택한 뒤 자리를 클릭하세요!');
                        if(teamAssignments[id] === selectedTeam) delete teamAssignments[id];
                        else teamAssignments[id] = selectedTeam;
                        saveAll(); renderTeamSeatMap();
                    };
                    grid.appendChild(seat);
                }
            }
            box.appendChild(grid); container.appendChild(box);
        });
    }

    function exportImage(targetId, filename) {
        html2canvas(document.getElementById(targetId), { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
            let a = document.createElement('a');
            a.download = filename; a.href = canvas.toDataURL(); a.click();
        });
    }

    function exportBackupJSON() {
        saveData();
        let data = {
            numSec: getVal('numSections'),
            numGrp: getVal('numGroups'),
            sec: getSections(),
            grp: getGroups(),
            seat: seatAssignments,
            team: teamAssignments,
            det: participantDetails
        };
        let blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        let a = document.createElement('a'); a.download = 'smart_seat_backup.json'; a.href = URL.createObjectURL(blob); a.click();
    }

    function importBackupJSON(e) {
        let file = e.target.files[0];
        if(!file) return;
        let reader = new FileReader();
        reader.onload = (event) => {
            try {
                let data = JSON.parse(event.target.result);
                if(data.sec && data.grp) {
                    localStorage.setItem('ss_num_sec', data.numSec || data.sec.length);
                    localStorage.setItem('ss_num_grp', data.numGrp || data.grp.length);
                    localStorage.setItem('ss_sec', JSON.stringify(data.sec));
                    localStorage.setItem('ss_grp', JSON.stringify(data.grp));
                    localStorage.setItem('ss_seat', JSON.stringify(data.seat || {}));
                    localStorage.setItem('ss_team', JSON.stringify(data.team || {}));
                    localStorage.setItem('ss_det', JSON.stringify(data.det || {}));
                    
                    loadData();
                    loadInputs();
                    alert('백업 파일을 성공적으로 불러왔습니다!');
                } else {
                    alert('올바른 백업 파일 형식이 아닙니다.');
                }
            } catch(err) { alert('파일을 읽는 중 오류가 발생했습니다.'); }
        };
        reader.readAsText(file);
        e.target.value = '';
    }

    function resetData() {
        if(confirm('모든 설정과 데이터를 초기화하시겠습니까?')) {
            localStorage.clear();
            seatAssignments = {}; teamAssignments = {}; participantDetails = {}; seatHistory = [];
            loadInputs();
            alert('초기화되었습니다.');
        }
    }
</script>
</body>
